name: car_segmentation
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=11.8
  - pip:
      - addict==2.4.0
      - hydra-core>=1.3.2
      - numpy<2.0.0
      - opencv-python>=4.8.0
      - pillow>=10.0.0
      - pycocotools>=2.0.7
      - supervision>=0.20.0
      - timm>=1.0.0
      - transformers>=4.38.0
      - yapf>=0.40.0
